<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lead Collector AI</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

height:100vh;

display:flex;

align-items:center;

justify-content:center;

font-family:Inter,Arial,sans-serif;

background:
linear-gradient(135deg,#090909,#202020);

}



.card{

width:480px;

background:#111;

color:white;

padding:35px;

border-radius:24px;

box-shadow:
0 20px 60px #000;

}



.logo{

font-size:30px;

font-weight:800;

margin-bottom:10px;

}



.subtitle{

color:#aaa;

font-size:14px;

margin-bottom:30px;

}



input{

width:100%;

height:50px;

background:#181818;

border:1px solid #333;

border-radius:12px;

padding:0 15px;

color:white;

font-size:15px;

margin-bottom:20px;

}



button{

width:100%;

height:52px;

border:0;

border-radius:12px;

background:#fff;

color:#000;

font-size:16px;

font-weight:700;

cursor:pointer;

transition:.3s;

}



button:hover{

transform:translateY(-2px);

}



button:disabled{

opacity:.5;

cursor:not-allowed;

}



.status{

display:none;

margin-top:25px;

background:#181818;

padding:18px;

border-radius:14px;

font-size:14px;

}



.loading{

display:inline-block;

width:10px;

height:10px;

border-radius:50%;

background:#00ff88;

margin-right:8px;

animation:pulse 1s infinite;

}



@keyframes pulse{

50%{

opacity:.2;

}

}



.results{

margin-top:20px;

max-height:350px;

overflow:auto;

background:#050505;

border-radius:12px;

padding:15px;

font-size:13px;

color:#ddd;

}



.counter{

display:flex;

gap:10px;

margin-top:15px;

}



.box{

background:#181818;

padding:15px;

border-radius:12px;

flex:1;

text-align:center;

}



.number{

font-size:22px;

font-weight:bold;

}



.label{

font-size:12px;

color:#888;

}


</style>


</head>


<body>


<div class="card">


<div class="logo">
🤖 Lead Collector AI
</div>


<div class="subtitle">
Extração inteligente de contatos e perfis públicos
</div>



<input 
id="url"
placeholder="Digite a URL do site"
/>



<button id="btn" onclick="coletar()">
Iniciar coleta
</button>



<div id="status" class="status"></div>



<div id="stats" class="counter"></div>



<div id="resultado" class="results"></div>



</div>



<script>


const API =
"https://lead-collector-api-zwha.onrender.com";



const btn =
document.getElementById("btn");

const status =
document.getElementById("status");

const resultado =
document.getElementById("resultado");

const stats =
document.getElementById("stats");




function atualizarStatus(texto){

status.style.display="block";

status.innerHTML=
`
<span class="loading"></span>
${texto}
`;

}




async function coletar(){


const url =
document.getElementById("url")
.value
.trim();



if(!url){

alert("Informe a URL do site");

return;

}



btn.disabled=true;

btn.innerHTML="Coletando...";


resultado.innerHTML="";

stats.innerHTML="";



atualizarStatus(
"Conectando ao site..."
);



setTimeout(()=>{

atualizarStatus(
"Analisando páginas e procurando perfis..."
);

},2000);



setTimeout(()=>{

atualizarStatus(
"Extraindo nomes, WhatsApps e emails..."
);

},5000);




try{


const response =
await fetch(
API+"/api/collect",
{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

url:url

})

}

);



const data =
await response.json();



status.innerHTML=
"✅ Coleta finalizada";



stats.innerHTML=

`

<div class="box">

<div class="number">
${data.pagesVisited || 0}
</div>

<div class="label">
Páginas
</div>

</div>


<div class="box">

<div class="number">
${data.contacts?.length || 0}
</div>

<div class="label">
Contatos
</div>

</div>

`;



resultado.innerHTML =
JSON.stringify(
data.contacts,
null,
2
);



}

catch(e){


status.innerHTML=
"❌ Erro na coleta";

resultado.innerHTML=e.message;


}


btn.disabled=false;

btn.innerHTML="Iniciar coleta";



}



</script>


</body>

</html>
